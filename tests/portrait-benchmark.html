<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait Canvas2D benchmark</title></head>
<body style="margin:0;background:#101014;color:#eee;font:14px system-ui">
<p id="results">Loading portrait…</p><button id="run">Benchmark held drag</button><button id="release">Release</button>
<canvas id="portrait" style="display:block;max-width:100%;height:auto"></canvas>
<script type="module">
import { CanvasPortraitEngine } from '/src/lib/portrait/canvas-engine.ts';
import { createPortraitMask } from '/src/lib/portrait/silhouette.ts';
const load = src => new Promise((resolve,reject) => { const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src; });
const canvas=document.querySelector('#portrait');
const results=document.querySelector('#results');
const images=await Promise.all(['portraits/picaro.webp','portraits/expressions.webp'].map(src=>load(import.meta.env.BASE_URL+src)));
const engine=new CanvasPortraitEngine(canvas,images,createPortraitMask());
const size=Math.min(360,innerWidth/1.8);
const width=size*2.2,height=size*1.8;
canvas.style.width=width+'px';
engine.resize(width,height,devicePixelRatio,{x:size*0.6,y:size*0.4,size});
let serial=0;
const nextFrame=()=>new Promise(requestAnimationFrame);
async function benchmark() {
  const token=++serial;
  engine.reset();engine.grab(1,0.55,0.42);engine.drag(1,120,-25);
  const samples=[];
  for(let i=0;i<28;i++) {
    const time=await nextFrame();if(token!==serial)return;
    const start=performance.now();engine.render(time,false);const duration=performance.now()-start;
    if(i>=8)samples.push(duration);
  }
  samples.sort((a,b)=>a-b);
  results.textContent=JSON.stringify({renderer:engine.rendererName,frames:samples.length,medianMs:+((samples[9]+samples[10])/2).toFixed(2),p95Ms:+samples[18].toFixed(2),maxMs:+samples[19].toFixed(2),cssSize:size,dpr:devicePixelRatio});
}
document.querySelector('#run').onclick=benchmark;
document.querySelector('#release').onclick=async()=>{const token=++serial;engine.releaseAll();while(engine.moving){const time=await nextFrame();if(token!==serial)return;engine.render(time,false);}};
await benchmark();
</script></body></html>
